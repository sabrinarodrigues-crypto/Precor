function renderGestaoOcorrencias(){
  const f = state.gestaoFilters;
  let list = state.occurrences;
  if(f.area!=='Todas') list = list.filter(o=>o.area===f.area);
  if(f.criticidade!=='Todas') list = list.filter(o=>o.criticality===f.criticidade);
  if(f.status!=='Todas') list = list.filter(o=>o.status===f.status);
  if(f.tipo!=='Todas') list = list.filter(o=>o.type===f.tipo);
  if(f.data) list = list.filter(o=>o.datetime.slice(0,10)===f.data);
  const areas = ['Todas', ...new Set(state.occurrences.map(o=>o.area))];
  const tipos = ['Todas', ...new Set(state.occurrences.map(o=>o.type))];

  return `
    <div class="filters-row">
      <input type="date" onchange="updGestaoFilter('data', this.value)" value="${f.data}">
      <select onchange="updGestaoFilter('area', this.value)">${areas.map(a=>`<option ${f.area===a?'selected':''}>${a}</option>`).join('')}</select>
      <select onchange="updGestaoFilter('criticidade', this.value)">
        <option ${f.criticidade==='Todas'?'selected':''}>Todas</option>
        ${['baixo','medio','alto','critico'].map(c=>`<option value="${c}" ${f.criticidade===c?'selected':''}>${fmtCrit(c)}</option>`).join('')}
      </select>
      <select onchange="updGestaoFilter('status', this.value)">
        <option ${f.status==='Todas'?'selected':''}>Todas</option>
        ${TIMELINE_STEPS.map(s=>`<option ${f.status===s?'selected':''}>${s}</option>`).join('')}
      </select>
      <select onchange="updGestaoFilter('tipo', this.value)">${tipos.map(t=>`<option ${f.tipo===t?'selected':''}>${t}</option>`).join('')}</select>
    </div>
    <div class="form-actions" style="justify-content:flex-end;margin-bottom:14px;">
      <button class="btn btn-sm" style="flex:none;" onclick="exportOccurrencesCSV()">${ICONS.doc} Exportar CSV (${list.length})</button>
    </div>
    <div class="card panel-pad">
      <div class="table-scroll">
      <table class="rtable">
        <thead><tr><th>ID</th><th>Data</th><th>Local</th><th>Tipo</th><th>Criticidade</th><th>Responsável</th><th>Status</th></tr></thead>
        <tbody>
          ${list.map(o=>`<tr onclick="abrirOcorrencia('${o.id}')">
            <td class="mono" data-label="ID">${o.id}</td><td data-label="Data">${formatDatetime(o.datetime)}</td><td data-label="Local">${o.location}</td><td data-label="Tipo">${o.type}</td>
            <td data-label="Criticidade">${critBadge(o.criticality)}</td><td data-label="Responsável">${o.responsible}</td><td data-label="Status">${statusBadge(o.status)}</td></tr>`).join('')}
        </tbody>
      </table>
      </div>
      ${list.length===0 ? '<div class="empty-state">Nenhuma ocorrência corresponde aos filtros selecionados.</div>' : ''}
    </div>`;
}
function updGestaoFilter(key, val){ state.gestaoFilters[key]=val; render(); }

function exportOccurrencesCSV(){
  const f = state.gestaoFilters;
  let list = state.occurrences;
  if(f.area!=='Todas') list = list.filter(o=>o.area===f.area);
  if(f.criticidade!=='Todas') list = list.filter(o=>o.criticality===f.criticidade);
  if(f.status!=='Todas') list = list.filter(o=>o.status===f.status);
  if(f.tipo!=='Todas') list = list.filter(o=>o.type===f.tipo);
  if(f.data) list = list.filter(o=>o.datetime.slice(0,10)===f.data);

  const headers = ['ID','Data','Local','Área','Tipo','Criticidade','Responsável','Status','Descrição'];
  const rows = list.map(o=>[o.id, formatDatetime(o.datetime), o.location, o.area, o.type, fmtCrit(o.criticality), o.responsible, o.status, o.description]);
  const csvEscape = v => '"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const csv = [headers, ...rows].map(r=>r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'precor_ocorrencias_'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  logAudit('Exportação CSV', list.length+' ocorrência(s) exportada(s) com os filtros atuais.');
  showToast('CSV exportado: '+list.length+' ocorrência(s).', 'sucesso');
}

function renderBarList(title, entries, colorFn){
  const max = Math.max(1, ...entries.map(e=>e[1]));
  return `
    <div class="card panel-pad" style="margin-bottom:16px;">
      <div class="section-title"><h3>${title}</h3></div>
      ${entries.length===0 ? '<div class="dim" style="font-size:12.5px;">Sem dados suficientes.</div>' : entries.map(([label,count])=>`
        <div class="bar-row">
          <div class="bar-label">${label}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${(count/max*100).toFixed(0)}%;background:${colorFn(label)};"></div></div>
          <div class="bar-count">${count}</div>
        </div>`).join('')}
    </div>`;
}

function renderIndicadores(){
  const all = state.occurrences;
  const total = all.length;
  const criticas = all.filter(o=>o.criticality==='critico').length;
  const encerradas = all.filter(o=>o.status==='Encerrada').length;
  const taxaEncerramento = total ? Math.round((encerradas/total)*100) : 0;
  const pctCriticas = total ? Math.round((criticas/total)*100) : 0;

  const porCriticidade = ['critico','alto','medio','baixo'].map(c=>[fmtCrit(c), all.filter(o=>o.criticality===c).length]).filter(e=>e[1]>0);
  const critColor = {'Crítico':'var(--red)','Alto':'var(--orange)','Médio':'var(--amber)','Baixo':'var(--teal)'};

  const areaCounts = {};
  all.forEach(o=>{ areaCounts[o.area] = (areaCounts[o.area]||0)+1; });
  const porArea = Object.entries(areaCounts).sort((a,b)=>b[1]-a[1]);

  const tipoCounts = {};
  all.forEach(o=>{ tipoCounts[o.type] = (tipoCounts[o.type]||0)+1; });
  const porTipo = Object.entries(tipoCounts).sort((a,b)=>b[1]-a[1]);

  return `
    <div class="kpi-grid" style="margin-bottom:18px;">
      <div class="card kpi blue"><div class="l">Total histórico</div><div class="n">${total}</div><div class="s">ocorrências</div></div>
      <div class="card kpi red"><div class="l">Críticas</div><div class="n">${pctCriticas}%</div><div class="s">do total</div></div>
      <div class="card kpi green"><div class="l">Taxa de encerramento</div><div class="n">${taxaEncerramento}%</div><div class="s">${encerradas} de ${total}</div></div>
      <div class="card kpi amber"><div class="l">Áreas com registro</div><div class="n">${porArea.length}</div><div class="s">áreas distintas</div></div>
    </div>
    ${renderBarList('Ocorrências por criticidade', porCriticidade, l=>critColor[l]||'var(--maroon)')}
    ${renderBarList('Ocorrências por área', porArea, ()=>'var(--maroon)')}
    ${renderBarList('Ocorrências por tipo de risco', porTipo, ()=>'var(--blue)')}
    <div class="dim" style="font-size:11.5px;text-align:center;margin-top:4px;">Indicadores calculados sobre o histórico completo registrado nesta sessão.</div>`;
}

function abrirNovoUsuario(){
  state.userFormOpen = true;
  state.userFormMode = 'new';
  state.userFormId = null;
  state.userFormDraft = {name:'', email:'', role:'lideranca', area:''};
  render();
  setTimeout(()=>{ const i=document.getElementById('uf-name'); if(i) i.focus(); }, 30);
}
function abrirEditarUsuario(id){
  const u = DEMO_USERS.find(x=>x.id===id);
  if(!u) return;
  state.userFormOpen = true;
  state.userFormMode = 'edit';
  state.userFormId = id;
  state.userFormDraft = {name:u.name, email:u.email, role:u.role, area:u.area};
  render();
}
function cancelarUsuarioForm(){
  state.userFormOpen = false;
  state.userFormId = null;
  render();
}
function salvarUsuario(){
  const name = document.getElementById('uf-name').value.trim();
  const email = document.getElementById('uf-email').value.trim();
  const role = document.getElementById('uf-role').value;
  const area = document.getElementById('uf-area').value.trim();
  if(!name || !email || !area){
    state.userFormError = 'Preencha nome, e-mail e área.';
    render();
    return;
  }
  const initials = name.trim().split(/\s+/).slice(0,2).map(p=>p[0]).join('').toUpperCase();
  if(state.userFormMode==='edit'){
    const u = DEMO_USERS.find(x=>x.id===state.userFormId);
    Object.assign(u, {name, email, role, area, initials});
    showToast('Usuário '+name+' atualizado.', 'sucesso');
    logAudit('Usuário editado', name+' ('+ROLE_LABELS[role]+', '+area+')');
  } else {
    DEMO_USERS.push({id:'u'+(DEMO_USERS.length+1)+'-'+Date.now().toString().slice(-4), name, email, role, area, initials});
    showToast('Usuário '+name+' cadastrado.', 'sucesso');
    logAudit('Usuário cadastrado', name+' ('+ROLE_LABELS[role]+', '+area+')');
  }
  state.userFormOpen = false;
  state.userFormId = null;
  state.userFormError = '';
  render();
}
function removerUsuario(id){
  const u = DEMO_USERS.find(x=>x.id===id);
  if(!u) return;
  if(u.id===state.user.id){ showToast('Você não pode remover o usuário com a sessão ativa.', 'alerta'); return; }
  const idx = DEMO_USERS.findIndex(x=>x.id===id);
  DEMO_USERS.splice(idx,1);
  showToast('Usuário '+u.name+' removido.', 'alerta');
  logAudit('Usuário removido', u.name+' ('+ROLE_LABELS[u.role]+')');
  render();
}

/* ============================= PWA (instalável como app) =============================
   Manifesto e ícone gerados em runtime via Blob — mantém o app em um único arquivo HTML,
   sem depender de arquivos externos, mas ainda oferecendo "Adicionar à tela inicial" com
   ícone e nome corretos. Não registra service worker (exigiria arquivos servidos por HTTP
   com o mesmo escopo, o que não se aplica a um arquivo aberto localmente) — funciona como
   atalho instalável, não como app 100% offline. */
(function setupPWA(){
  try{
    const iconSvg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">'+
      '<rect width="100" height="100" rx="22" fill="#7d2438"/>'+
      '<path d="M50 18 L74 27 V47 C74 64 63 76 50 82 C37 76 26 64 26 47 V27 Z" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>'+
      '</svg>';
    const iconUrl = 'data:image/svg+xml,'+encodeURIComponent(iconSvg);

    const appleIcon = document.createElement('link');
    appleIcon.rel = 'apple-touch-icon';
    appleIcon.href = iconUrl;
    document.head.appendChild(appleIcon);

    const manifest = {
      name: 'PRECOR — Prevenção, Comunicação e Resposta a Riscos Industriais',
      short_name: 'PRECOR',
      start_url: '.',
      display: 'standalone',
      background_color: '#ffffff',
      theme_color: '#7d2438',
      icons: [{ src: iconUrl, sizes: '100x100', type: 'image/svg+xml', purpose: 'any' }]
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'});
    const manifestLink = document.createElement('link');
    manifestLink.rel = 'manifest';
    manifestLink.href = URL.createObjectURL(manifestBlob);
    document.head.appendChild(manifestLink);
  }catch(e){ /* navegador sem suporte — app continua funcionando normalmente */ }
})();

/* ============================= INIT ============================= */
render();
</script>
