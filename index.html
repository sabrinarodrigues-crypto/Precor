<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PRECOR">
<title>PRECOR — Prevenção, Comunicação e Resposta a Situações de Risco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon:#7d2438;
    --maroon-dark:#5e1b2a;
    --maroon-darker:#4a1521;
    --maroon-soft:#fbebee;
    --maroon-soft-2:#f6dde1;
    --bg:#ffffff;
    --card:#ffffff;
    --border:#e1e3e8;
    --border-strong:#d8dbe1;
    --text:#1c1f26;
    --text-muted:#667085;
    --text-dim:#9aa1ac;
    --red:#c22a3a;      --red-bg:#fce6e8;
    --orange:#c2650f;   --orange-bg:#fdefdf;
    --amber:#a8790a;    --amber-bg:#fdf3d8;
    --green:#1f8b4d;    --green-bg:#e6f6ec;
    --blue:#2f5fd1;     --blue-bg:#e9eefc;
    --teal:#12806f;     --teal-bg:#e2f5f1;
    --font-display:'Poppins',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
    --radius:14px;
    --radius-sm:10px;
    --topbar-h:64px;
    --sidebar-w:280px;
    --shadow-card:0 1px 3px rgba(20,20,30,.06), 0 2px 14px rgba(20,20,30,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#ffffff;color-scheme:light;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    font-size:14.5px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
  }
  #app{min-height:100vh;min-height:100dvh;background:var(--bg);}
  h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0;color:var(--text);}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  ::selection{background:var(--maroon-soft-2);}

  .muted{color:var(--text-muted);}
  .dim{color:var(--text-dim);}
  .mono{font-family:var(--font-mono);}
  .hidden{display:none !important;}

  .btn{
    border:1.5px solid var(--border-strong);
    background:#fff;
    color:var(--text);
    padding:11px 18px;
    border-radius:var(--radius-sm);
    font-size:14px;
    font-weight:600;
    font-family:var(--font-display);
    transition:border-color .15s, background .15s, transform .05s;
  }
  .btn:hover{border-color:var(--maroon);background:var(--maroon-soft);}
  .btn:active{transform:scale(.98);}
  .btn:focus-visible{outline:2px solid var(--maroon);outline-offset:2px;}
  .btn-primary{background:#a24a5c;border-color:#a24a5c;color:#fff;}
  .btn-primary:hover{background:#8f3d4f;border-color:#8f3d4f;}
  .btn-maroon{background:var(--maroon);border-color:var(--maroon);color:#fff;}
  .btn-maroon:hover{background:var(--maroon-dark);border-color:var(--maroon-dark);}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--text-muted);}
  .btn-ghost:hover{color:var(--maroon);background:var(--maroon-soft);}
  .btn-block{width:100%;}
  .btn-lg{padding:15px 20px;font-size:15px;}
  .btn-sm{padding:7px 13px;font-size:12.5px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-link{background:none;border:none;color:var(--maroon);font-weight:600;font-size:12.5px;padding:0;}

  .badge{
    display:inline-flex;align-items:center;gap:5px;
    padding:4px 11px;border-radius:100px;
    font-size:11.5px;font-weight:700;font-family:var(--font-display);
    white-space:nowrap;
  }
  .badge-baixo{background:var(--teal-bg);color:var(--teal);}
  .badge-medio{background:var(--amber-bg);color:var(--amber);}
  .badge-alto{background:var(--orange-bg);color:var(--orange);}
  .badge-critico{background:var(--red-bg);color:var(--red);}
  .badge-normal{background:var(--teal-bg);color:var(--teal);}
  .badge-atencao{background:var(--amber-bg);color:var(--amber);}
  .badge-anormal{background:var(--orange-bg);color:var(--orange);}
  .badge-registrada, .badge-encaminhada{background:var(--blue-bg);color:var(--blue);}
  .badge-ematendimento{background:var(--amber-bg);color:var(--amber);}
  .badge-resolvida{background:var(--teal-bg);color:var(--teal);}
  .badge-encerrada{background:var(--green-bg);color:var(--green);}
  .badge-novo{background:var(--maroon);color:#fff;}
  .badge-outline{background:#fff;border:1.5px solid var(--border-strong);color:var(--text-muted);}

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow-card);
  }
  .panel-pad{padding:22px;}

  /* ---------- Login ---------- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 18px;background:var(--bg);}
  .login-card{width:100%;max-width:400px;}
  .login-logo-row{display:flex;align-items:center;gap:13px;margin-bottom:34px;}
  .brand-mark{
    width:52px;height:52px;border-radius:14px;background:var(--maroon);
    display:flex;align-items:center;justify-content:center;flex:none;color:#fff;
  }
  .brand-name{font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--text);letter-spacing:.3px;}
  .login-card h1{font-size:clamp(24px,6vw,29px);margin-bottom:8px;}
  .login-card>.muted{display:block;margin-bottom:30px;font-size:14.5px;}
  .field{margin-bottom:18px;}
  .field label{display:block;font-size:11.5px;color:var(--text-muted);margin-bottom:7px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;}
  .input-icon{position:relative;}
  .input-icon > svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--text-dim);pointer-events:none;}
  .input-icon input, .field select{
    width:100%;background:#fff;border:1.5px solid var(--border-strong);
    color:var(--text);padding:13px 15px 13px 44px;border-radius:12px;font-size:14.5px;
  }
  .field select{padding-left:15px;}
  .input-icon input:focus, .field select:focus{border-color:var(--maroon);}
  .eye-toggle{position:absolute;right:13px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);padding:5px;border-radius:6px;pointer-events:auto;}
  .eye-toggle:hover{color:var(--maroon);background:var(--maroon-soft);}
  .login-error{color:var(--red);font-size:12.5px;margin:-6px 0 14px;min-height:1em;}
  .login-help-link{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--text-muted);font-size:13px;margin-top:18px;background:none;border:none;width:100%;font-weight:600;}
  .login-help-link:hover{color:var(--maroon);}
  .demo-panel{margin-top:16px;border-top:1px solid var(--border);padding-top:16px;}
  .demo-list{display:flex;flex-direction:column;gap:8px;}
  .demo-card{
    display:flex;align-items:center;gap:12px;text-align:left;
    border:1.5px solid var(--border-strong);background:#fff;border-radius:12px;padding:11px 13px;color:var(--text);
  }
  .demo-card:hover{border-color:var(--maroon);}
  .demo-card.active{border-color:var(--maroon);background:var(--maroon-soft);}
  .demo-avatar{width:36px;height:36px;border-radius:50%;background:var(--maroon-soft-2);color:var(--maroon);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:13px;flex:none;}
  .demo-card b{display:block;font-size:13.5px;}
  .demo-card span{font-size:11.5px;color:var(--text-muted);}
  .login-disclaimer{margin-top:26px;font-size:11.5px;color:var(--text-dim);text-align:center;line-height:1.5;}

  /* ---------- Shell / Topbar / Sidebar ---------- */
  .topbar{
    position:fixed;top:0;left:0;right:0;height:var(--topbar-h);background:#fff;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:40;gap:10px;
  }
  .topbar-left{display:flex;align-items:center;gap:12px;min-width:0;flex:1;}
  .hamburger{background:none;border:none;color:var(--text);padding:6px;display:flex;flex:none;}
  .topbar h2{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
  .topbar-actions{display:flex;align-items:center;gap:8px;flex:none;}
  .icon-btn{
    width:40px;height:40px;border-radius:11px;border:1.5px solid var(--border-strong);background:#fff;
    display:flex;align-items:center;justify-content:center;color:var(--text);position:relative;flex:none;
  }
  .icon-btn:hover{border-color:var(--maroon);color:var(--maroon);}
  .icon-btn.maroon{background:var(--maroon);border-color:var(--maroon);color:#fff;}
  .icon-btn.maroon:hover{background:var(--maroon-dark);}
  .count-pill{
    position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:10px;font-weight:700;
    min-width:18px;height:18px;border-radius:100px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff;
  }

  .shell{padding-top:var(--topbar-h);min-height:100vh;}
  .backdrop{position:fixed;inset:0;background:rgba(20,10,14,.45);z-index:45;opacity:0;pointer-events:none;transition:opacity .2s;}
  .backdrop.show{opacity:1;pointer-events:auto;}

  .sidebar{
    position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:var(--maroon-dark);
    color:#fff;z-index:50;display:flex;flex-direction:column;
    transform:translateX(-100%);transition:transform .22s ease, width .18s ease;
  }
  .sidebar.open{transform:translateX(0);}
  .sidebar-head{display:flex;align-items:flex-start;justify-content:space-between;padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.12);gap:8px;}
  .sidebar-head .brand-mark{background:rgba(255,255,255,.14);width:42px;height:42px;border-radius:11px;flex:none;}
  .sidebar-brand-text{display:flex;gap:11px;align-items:center;min-width:0;}
  .sidebar-brand-text b{display:block;font-family:var(--font-display);font-size:17px;font-weight:700;white-space:nowrap;}
  .sidebar-brand-text span{display:block;font-size:10.5px;color:rgba(255,255,255,.65);margin-top:2px;line-height:1.35;max-width:172px;}
  .sidebar-close{background:none;border:none;color:rgba(255,255,255,.8);padding:4px;flex:none;}
  .sidebar-collapse-btn{display:none;background:none;border:none;color:rgba(255,255,255,.75);padding:6px;flex:none;border-radius:8px;}
  .sidebar-collapse-btn:hover{background:rgba(255,255,255,.1);color:#fff;}
  .sidebar-section-label{padding:16px 20px 6px;font-size:11px;font-weight:700;letter-spacing:1px;color:rgba(255,255,255,.5);text-transform:uppercase;white-space:nowrap;overflow:hidden;}
  .nav{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:10px;}
  .nav-item{
    display:flex;align-items:center;gap:13px;width:100%;text-align:left;
    padding:12px 20px;color:rgba(255,255,255,.85);font-size:14.5px;font-weight:500;background:none;border:none;
  }
  .nav-item:hover{background:rgba(255,255,255,.06);}
  .nav-item.active{background:rgba(255,255,255,.14);color:#fff;font-weight:700;}
  .nav-item svg{flex:none;opacity:.9;}
  .nav-item span.nav-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .nav-badge{margin-left:auto;background:#e05a71;color:#fff;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:100px;flex:none;}
  .sidebar-foot{border-top:1px solid rgba(255,255,255,.12);padding:16px 20px;display:flex;align-items:center;gap:12px;}
  .sf-avatar{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:13.5px;flex:none;}
  .sf-meta{flex:1;min-width:0;}
  .sf-meta b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sf-meta span{display:block;font-size:11px;color:rgba(255,255,255,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sf-logout{background:none;border:none;color:rgba(255,255,255,.75);padding:6px;flex:none;}
  .sf-logout:hover{color:#fff;}

  /* Menu minimizado (desktop) — mostra só ícones para ganhar espaço de tela */
  @media (min-width:900px){
    .sidebar-close{display:none;}
    .sidebar-collapse-btn{display:flex;}
    .sidebar.collapsed{width:76px;}
    .sidebar.collapsed .sidebar-head{justify-content:center;padding:22px 0 18px;}
    .sidebar.collapsed .sidebar-brand-text span{display:none;}
    .sidebar.collapsed .sidebar-brand-text b{display:none;}
    .sidebar.collapsed .sidebar-collapse-btn{transform:rotate(180deg);}
    .sidebar.collapsed .sidebar-section-label{display:none;}
    .sidebar.collapsed .nav-item{justify-content:center;padding:13px 0;gap:0;position:relative;}
    .sidebar.collapsed .nav-item .nav-label{display:none;}
    .sidebar.collapsed .nav-badge{
      display:block;position:absolute;top:8px;right:22px;width:9px;height:9px;min-width:0;
      padding:0;font-size:0;line-height:0;border-radius:50%;border:2px solid var(--maroon-dark);
    }
    .sidebar.collapsed .sidebar-foot{justify-content:center;padding:16px 8px;}
    .sidebar.collapsed .sf-meta, .sidebar.collapsed .sf-logout{display:none;}
  }

  .main{padding:20px 18px 60px;max-width:1080px;margin:0 auto;animation:main-fade-in .22s ease;}
  @keyframes main-fade-in{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){ .main{animation:none;} }
  .page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap;}
  .page-head h1{font-size:clamp(19px,5vw,23px);}
  .page-head .muted{font-size:13px;margin-top:3px;}
  .breadcrumb{margin-bottom:10px;}
  .breadcrumb button{background:none;border:none;color:var(--text-muted);font-size:13px;font-weight:600;padding:0;}
  .breadcrumb button:hover{color:var(--maroon);}

  /* ---------- Banner critical ---------- */
  .crit-banner{
    display:flex;align-items:flex-start;gap:14px;background:var(--maroon);color:#fff;
    border-radius:var(--radius);padding:15px 18px;margin-bottom:18px;flex-wrap:wrap;
  }
  .crit-banner .cb-icon{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex:none;}
  .crit-banner b{display:block;font-size:14px;}
  .crit-banner span{display:block;font-size:12.5px;color:rgba(255,255,255,.85);margin-top:2px;}
  .crit-banner .cb-time{margin-left:auto;font-size:11.5px;color:rgba(255,255,255,.7);flex:none;}
  @media (max-width:480px){
    .crit-banner .cb-time{margin-left:52px;}
  }

  /* ---------- KPI ---------- */
  .kpi-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:22px;}
  .kpi{padding:16px 16px;border-left:4px solid var(--border-strong);border-radius:12px;}
  .kpi .l{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text-muted);}
  .kpi .n{font-family:var(--font-display);font-size:clamp(22px,6vw,30px);font-weight:700;margin:6px 0 2px;}
  .kpi .s{font-size:12px;color:var(--text-dim);}
  .kpi.amber{border-left-color:var(--amber);}
  .kpi.orange{border-left-color:var(--orange);}
  .kpi.green{border-left-color:var(--green);}
  .kpi.blue{border-left-color:var(--blue);}
  .kpi.red{border-left-color:var(--red);}
  .kpi.teal{border-left-color:var(--teal);}

  .section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .section-title h3{font-size:16px;}

  .occ-card{padding:16px;margin-bottom:10px;cursor:pointer;transition:transform .08s, border-color .15s;}
  .occ-card:active{transform:scale(.985);}
  .occ-card:hover{border-color:var(--maroon);}
  .occ-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
  .occ-top b{min-width:0;overflow-wrap:break-word;}
  .occ-top b{font-size:14.5px;font-weight:700;line-height:1.35;}
  .occ-tags{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap;align-items:center;}
  .occ-meta{font-size:12px;color:var(--text-dim);margin-top:8px;}

  /* ---------- Search / filters ---------- */
  .search-box{position:relative;margin-bottom:14px;}
  .search-box svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-dim);}
  .search-box input{width:100%;padding:12px 14px 12px 42px;border-radius:12px;border:1.5px solid var(--border-strong);background:#fff;font-size:14px;}
  .search-box input:focus{border-color:var(--maroon);}
  .chip-row{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -18px 10px;padding:2px 18px 6px;scrollbar-width:none;}
  .chip-row::-webkit-scrollbar{display:none;}
  @media (min-width:900px){ .chip-row{flex-wrap:wrap;overflow-x:visible;margin:0 0 10px;padding:0;} }
  .chip{
    border:1.5px solid var(--border-strong);background:#fff;color:var(--text-muted);
    padding:8px 15px;border-radius:100px;font-size:13px;font-weight:600;font-family:var(--font-display);
    flex:none;white-space:nowrap;
  }
  .chip.active{border-color:var(--maroon);background:var(--maroon-soft);color:var(--maroon);}
  .results-count{font-size:12.5px;color:var(--text-dim);margin:4px 0 14px;}

  /* ---------- Form (sheet style) ---------- */
  .sheet-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
  .sheet-head h1{font-size:22px;}
  .sheet-close{background:none;border:none;color:var(--text-dim);padding:4px;}
  .form-section{margin-bottom:22px;}
  .form-section > label, .field-label{display:block;font-size:13.5px;font-weight:700;font-family:var(--font-display);margin-bottom:10px;}
  .option-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
  .option-box{
    border:1.5px solid var(--border-strong);background:#fff;border-radius:12px;padding:14px 14px;
    text-align:left;font-size:13.5px;font-weight:600;color:var(--text);line-height:1.35;
  }
  .option-box.selected{border-color:var(--maroon);background:var(--maroon-soft);color:var(--maroon);}
  .crit-row{display:flex;gap:8px;}
  .crit-box{flex:1;border:1.5px solid var(--border-strong);background:#fff;border-radius:12px;padding:12px 6px;text-align:center;font-size:13px;font-weight:700;color:var(--text-muted);font-family:var(--font-display);}
  .crit-box.sel-baixo.selected{border-color:var(--teal);background:var(--teal-bg);color:var(--teal);}
  .crit-box.sel-medio.selected{border-color:var(--amber);background:var(--amber-bg);color:var(--amber);}
  .crit-box.sel-alto.selected{border-color:var(--orange);background:var(--orange-bg);color:var(--orange);}
  .crit-box.sel-critico.selected{border-color:var(--red);background:var(--red-bg);color:var(--red);}
  .form-grid-2{display:grid;grid-template-columns:1fr;gap:14px;}
  input[type=text]:not(.input-icon input), input[type=datetime-local], input[type=date], .form-section input, .form-section select{
    width:100%;background:#fff;border:1.5px solid var(--border-strong);color:var(--text);
    padding:12px 14px;border-radius:12px;font-size:14px;
  }
  textarea{width:100%;resize:vertical;min-height:88px;background:#fff;border:1.5px solid var(--border-strong);color:var(--text);padding:12px 14px;border-radius:12px;font-size:14px;}
  input:focus, select:focus, textarea:focus{border-color:var(--maroon);outline:none;}
  .form-actions{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap;}
  .form-actions .btn{flex:1;min-width:140px;}
  @media (max-width:420px){
    .form-actions{flex-direction:column;}
    .form-actions .btn{width:100%;}
  }
  .dupcheck-box{margin-top:16px;padding:16px;border-radius:12px;background:var(--amber-bg);border:1.5px solid #f0dca6;}
  .dupcheck-label{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--amber);font-size:13.5px;margin-bottom:6px;}
  .dupcheck-box p{margin:0 0 12px;color:var(--text-muted);font-size:13px;line-height:1.5;}
  .attach-row{margin-top:12px;}
  .attach-btn{
    display:inline-flex;align-items:center;gap:8px;border:1.5px dashed var(--border-strong);background:#fff;
    color:var(--text-muted);padding:10px 14px;border-radius:10px;font-size:12.5px;font-weight:600;cursor:pointer;
  }
  .attach-btn:hover{border-color:var(--maroon);color:var(--maroon);}
  .attach-btn input{display:none;}
  .attach-preview{position:relative;display:inline-block;margin-top:10px;}
  .attach-preview img{max-width:100%;max-height:160px;border-radius:10px;border:1px solid var(--border);display:block;}
  .attach-remove{
    position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;
    border:2px solid #fff;display:flex;align-items:center;justify-content:center;
  }
  .history-image{max-width:220px;max-height:150px;border-radius:8px;border:1px solid var(--border);margin-top:6px;display:block;cursor:pointer;}

  /* ---------- Notificações ativas (toast) ---------- */
  #toast-root{position:fixed;top:14px;left:0;right:0;z-index:300;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 14px;}
  .toast{
    max-width:420px;width:100%;background:#fff;border-left:4px solid var(--blue);border-radius:10px;
    box-shadow:0 8px 24px rgba(20,20,30,.18);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;
    opacity:0;transform:translateY(-14px);transition:opacity .22s ease, transform .22s ease;pointer-events:auto;
  }
  .toast.show{opacity:1;transform:translateY(0);}
  .toast svg{flex:none;margin-top:1px;}
  .toast-text{font-size:13px;font-weight:600;color:var(--text);line-height:1.4;}
  .toast-critico{border-left-color:var(--red);}
  .toast-critico svg{color:var(--red);}
  .toast-sucesso{border-left-color:var(--teal);}
  .toast-sucesso svg{color:var(--teal);}
  .toast-info{border-left-color:var(--blue);}
  .toast-info svg{color:var(--blue);}
  .toast-alerta{border-left-color:var(--orange);}
  .toast-alerta svg{color:var(--orange);}
  @media (min-width:900px){ #toast-root{left:auto;right:20px;align-items:flex-end;} .toast{width:360px;} }

  .field-error{color:var(--red);font-size:12.5px;font-weight:600;margin:-6px 0 12px;}
  .login-notice{
    display:flex;gap:10px;align-items:flex-start;background:var(--blue-bg);border:1px solid #c7d7f5;color:#2a4a86;
    padding:12px 14px;border-radius:12px;font-size:12px;line-height:1.5;margin-bottom:24px;
  }
  .login-notice svg{flex:none;color:var(--blue);margin-top:1px;}
  .attach-loading{font-size:12px;color:var(--text-muted);margin-top:10px;}

  .toggle-row{
    display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;text-align:left;
    border:1.5px solid var(--border-strong);border-radius:12px;padding:14px;background:#fff;
  }
  .toggle-row:hover{border-color:var(--maroon);}
  .toggle-switch{width:44px;height:26px;border-radius:100px;background:var(--border-strong);position:relative;flex:none;transition:background .15s;}
  .toggle-switch.on{background:var(--maroon);}
  .toggle-knob{width:20px;height:20px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .toggle-switch.on .toggle-knob{left:21px;}

  .suggestion-box{border-left:4px solid var(--maroon);}
  .suggestion-tag{background:var(--maroon-soft);color:var(--maroon);}

  .trend-line{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;margin-top:8px;}
  .trend-bad{color:var(--orange);}
  .trend-good{color:var(--teal);}
  .trend-stable{color:var(--text-dim);font-weight:600;}

  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .bar-row:last-child{margin-bottom:0;}
  .bar-label{width:38%;flex:none;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bar-track{flex:1;height:10px;background:var(--border);border-radius:100px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:100px;transition:width .3s ease;}
  .bar-count{width:26px;flex:none;text-align:right;font-family:var(--font-mono);font-size:12.5px;font-weight:600;color:var(--text-muted);}
  @media (max-width:480px){ .bar-label{width:34%;font-size:11.5px;} }

  .profile-switcher{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:151;
    background:#fff;border-radius:16px;width:min(360px, calc(100vw - 40px));max-height:80vh;overflow-y:auto;
    box-shadow:0 20px 50px rgba(20,10,14,.35);
  }
  .profile-switcher-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:18px 18px 6px;}
  .profile-switcher-head b{font-size:15px;font-family:var(--font-display);}

  .global-search-panel{
    position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:151;
    background:#fff;border-radius:16px;width:min(480px, calc(100vw - 32px));max-height:70vh;overflow:hidden;
    display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(20,10,14,.35);
  }
  .global-search-input-row{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);flex:none;}
  .global-search-input-row svg{color:var(--text-dim);flex:none;}
  .global-search-input-row input{flex:1;border:none;font-size:15px;outline:none;background:none;color:var(--text);}
  .global-search-results{overflow-y:auto;padding:6px 8px;}
  .search-group-label{padding:10px 10px 4px;font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text-dim);}
  .search-result-item{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:none;
    padding:10px;border-radius:10px;color:var(--text);
  }
  .search-result-item:hover{background:var(--maroon-soft);}
  .search-result-item svg{color:var(--maroon);flex:none;}
  .search-result-item div{flex:1;min-width:0;}
  .search-result-item b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .search-result-item span{display:block;font-size:11px;color:var(--text-dim);}

  .onboarding-card{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:161;
    background:#fff;border-radius:16px;width:min(340px, calc(100vw - 40px));padding:24px;
    box-shadow:0 20px 50px rgba(20,10,14,.35);
  }
  .onboarding-dots{display:flex;gap:6px;margin-bottom:16px;}
  .onboarding-dot{width:6px;height:6px;border-radius:50%;background:var(--border-strong);}
  .onboarding-dot.active{background:var(--maroon);width:18px;border-radius:100px;}

  .confirm-box{text-align:center;padding:52px 24px;}
  .confirm-icon{width:66px;height:66px;border-radius:50%;background:var(--green-bg);color:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;}
  .protocol{font-family:var(--font-mono);font-size:27px;color:var(--maroon);margin:12px 0 4px;font-weight:600;}

  /* ---------- Timeline ---------- */
  /* Mobile: lista vertical (dot + linha à esquerda, rótulo à direita) — evita
     5 rótulos espremidos numa linha só e colando um no outro. */
  .timeline{display:flex;flex-direction:column;margin:6px 0 4px;}
  .tl-step{flex:none;display:flex;align-items:flex-start;gap:12px;text-align:left;position:relative;padding-bottom:20px;}
  .tl-step:last-child{padding-bottom:0;}
  .tl-dot{width:15px;height:15px;border-radius:50%;background:#fff;border:2.5px solid var(--border-strong);position:relative;z-index:1;flex:none;margin-top:1px;}
  .tl-step.done .tl-dot{background:var(--green);border-color:var(--green);}
  .tl-step.current .tl-dot{background:var(--maroon);border-color:var(--maroon);box-shadow:0 0 0 4px var(--maroon-soft);}
  .tl-step::before{content:"";position:absolute;left:6.5px;top:16px;width:2px;height:calc(100% - 6px);background:var(--border-strong);z-index:0;}
  .tl-step:last-child::before{display:none;}
  .tl-step.done::before{background:var(--green);}
  .tl-step span{font-size:13px;color:var(--text-dim);font-weight:600;line-height:1.4;}
  .tl-step.current span{color:var(--maroon);}
  .tl-step.done span{color:var(--green);}

  @media (min-width:680px){
    .timeline{flex-direction:row;}
    .tl-step{flex:1;text-align:center;display:block;padding-bottom:0;}
    .tl-dot{margin:0 auto 8px;}
    .tl-step::before{top:6.5px;left:-50%;width:100%;height:2px;}
    .tl-step:first-child::before{display:none;}
    .tl-step:last-child::before{display:block;}
    .tl-step span{font-size:10.8px;}
  }

  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px;}
  .dg-item span{display:block;font-size:11px;color:var(--text-dim);margin-bottom:3px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;}
  .dg-item b{font-size:14px;font-weight:600;}

  .log-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
  .log-item:last-child{border-bottom:none;}
  .log-dot{width:8px;height:8px;border-radius:50%;background:var(--maroon);margin-top:6px;flex:none;}
  .log-item b{font-size:13px;display:block;}
  .log-item span{font-size:11.5px;color:var(--text-dim);}

  /* ---------- Alerts ---------- */
  .tab-row{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .alert-card{border-left:4px solid var(--border-strong);padding:16px;margin-bottom:12px;}
  .alert-card.critico{border-left-color:var(--red);}
  .alert-card.alto{border-left-color:var(--orange);}
  .alert-card.medio{border-left-color:var(--amber);}
  .alert-card.baixo{border-left-color:var(--teal);}
  .alert-tags{display:flex;gap:7px;margin-bottom:9px;flex-wrap:wrap;}
  .alert-card b.a-title{display:block;font-size:15px;margin-bottom:6px;}
  .alert-card p{margin:0 0 10px;color:var(--text-muted);font-size:13.5px;line-height:1.5;}
  .alert-meta-row{display:flex;gap:12px;font-size:11.5px;color:var(--text-dim);margin-bottom:12px;}
  .alert-actions{display:flex;gap:8px;flex-wrap:wrap;}
  @media (max-width:420px){
    .alert-actions{flex-direction:column;}
    .alert-actions .btn{width:100%;}
  }

  /* ---------- Procedures ---------- */
  .proc-card{padding:18px;margin-bottom:12px;cursor:pointer;display:flex;gap:14px;transition:transform .08s, border-color .15s;}
  .proc-card:active{transform:scale(.985);}
  .proc-card:hover{border-color:var(--maroon);}
  .proc-icon{width:44px;height:44px;border-radius:11px;background:var(--maroon-soft);color:var(--maroon);display:flex;align-items:center;justify-content:center;flex:none;}
  .proc-body{flex:1;min-width:0;}
  .proc-cat-tag{display:inline-block;background:var(--maroon-soft);color:var(--maroon);font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px;margin-bottom:7px;}
  .proc-body h4{font-size:15.5px;margin-bottom:6px;}
  .proc-body p{color:var(--text-muted);font-size:13px;margin:0 0 10px;line-height:1.45;}
  .proc-meta-row{display:flex;gap:14px;font-size:11.5px;color:var(--text-dim);margin-bottom:12px;flex-wrap:wrap;}
  .step-list{counter-reset:step;padding:0;list-style:none;margin:0;}
  .step-list li{counter-increment:step;display:flex;gap:13px;padding:12px 0;border-bottom:1px solid var(--border);font-size:14px;line-height:1.5;}
  .step-list li:last-child{border-bottom:none;}
  .step-list li::before{
    content:counter(step);flex:none;width:26px;height:26px;border-radius:50%;background:var(--maroon-soft);
    display:flex;align-items:center;justify-content:center;font-size:12.5px;font-family:var(--font-display);font-weight:700;color:var(--maroon);
  }

  /* ---------- Monitoring ---------- */
  .exp-tag{display:inline-flex;align-items:center;gap:6px;background:var(--blue-bg);color:var(--blue);padding:5px 12px;border-radius:100px;font-size:11.5px;font-weight:700;margin-bottom:16px;}
  .sensor-grid{display:grid;grid-template-columns:1fr;gap:12px;}
  .sensor-card{padding:16px;border-left:4px solid var(--border-strong);}
  .sensor-card.st-normal{border-left-color:var(--teal);}
  .sensor-card.st-atencao{border-left-color:var(--amber);}
  .sensor-card.st-anormal{border-left-color:var(--orange);}
  .sensor-card.st-critico{border-left-color:var(--red);background:var(--red-bg);}
  .sc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:8px;}
  .sc-name{font-size:13.5px;font-weight:700;}
  .sc-area{font-size:11.5px;color:var(--text-dim);}
  .sc-val{font-family:var(--font-mono);font-size:clamp(22px,5vw,28px);font-weight:600;margin:4px 0;}
  .sc-val-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;}
  .sparkline{width:70px;height:24px;flex:none;margin-bottom:6px;}
  .sc-range{font-size:11.5px;color:var(--text-dim);}
  .scale{height:6px;border-radius:4px;background:var(--border);margin-top:10px;overflow:hidden;}
  .scale > div{height:100%;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{text-align:left;padding:11px 12px;color:var(--text-dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1.5px solid var(--border);font-weight:700;}
  tbody td{padding:12px 12px;border-bottom:1px solid var(--border);}
  tbody tr:hover{background:var(--maroon-soft);cursor:pointer;}
  tbody tr:active{background:var(--maroon-soft-2);}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -18px;padding:0 18px;}
  @media (min-width:900px){ .table-scroll{margin:0;padding:0;} }
  .filters-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .filters-row select, .filters-row input{background:#fff;border:1.5px solid var(--border-strong);color:var(--text);padding:9px 11px;border-radius:10px;font-size:12.5px;flex:1 1 130px;min-width:0;}

  /* Tabelas viram cartões empilhados em telas pequenas */
  @media (max-width:680px){
    .rtable thead{display:none;}
    .rtable, .rtable tbody, .rtable tr, .rtable td{display:block;width:100%;}
    .rtable{border:none;}
    .rtable tr{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow-card);}
    .rtable tr:hover{background:#fff;}
    .rtable td{
      border:none;padding:7px 0;display:flex;flex-direction:column;align-items:flex-start;
      gap:2px;text-align:left;overflow-wrap:anywhere;word-break:break-word;
    }
    .rtable td::before{content:attr(data-label);font-weight:700;color:var(--text-dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;}
    .rtable td > div{width:100%;}
    .table-scroll{overflow-x:visible;margin:0;padding:0;}
  }

  .empty-state{text-align:center;padding:50px 20px;color:var(--text-dim);}

  /* ---------- Emergência rápida (FAB + fluxo) ---------- */
  .fab-emergency{
    position:fixed;right:18px;bottom:22px;z-index:38;
    background:#c81e34;color:#fff;border:none;border-radius:100px;
    padding:15px 20px;display:flex;align-items:center;gap:9px;
    font-family:var(--font-display);font-weight:700;font-size:14px;
    box-shadow:0 8px 22px rgba(200,30,52,.4);
  }
  .fab-emergency::before{
    content:"";position:absolute;inset:-4px;border-radius:100px;border:2px solid rgba(200,30,52,.5);
    animation:fab-ping 2.2s infinite;
  }
  @keyframes fab-ping{0%{transform:scale(1);opacity:.7;}100%{transform:scale(1.18);opacity:0;}}
  .fab-emergency span.fab-label{white-space:nowrap;}
  @media (max-width:480px){ .fab-emergency span.fab-label{display:none;} .fab-emergency{padding:15px;} }

  .emg-wrap{max-width:480px;margin:0 auto;}
  .emg-head{text-align:center;margin-bottom:22px;}
  .emg-head .emg-icon{
    width:60px;height:60px;border-radius:50%;background:#fce7e9;color:#c81e34;
    display:flex;align-items:center;justify-content:center;margin:0 auto 14px;
  }
  .emg-head h1{font-size:22px;}
  .emg-head p{color:var(--text-muted);font-size:13.5px;margin-top:6px;}
  .emg-tile-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
  .emg-tile{
    border:2px solid var(--border-strong);background:#fff;border-radius:16px;padding:22px 14px;
    text-align:center;font-family:var(--font-display);font-weight:700;font-size:14.5px;color:var(--text);
    display:flex;flex-direction:column;align-items:center;gap:10px;
  }
  .emg-tile:hover{border-color:#c81e34;background:#fdf1f2;}
  .emg-tile svg{color:#c81e34;}
  .emg-selected-tag{display:flex;align-items:center;gap:10px;background:#fdf1f2;color:#c81e34;padding:10px 14px;border-radius:12px;font-weight:700;font-size:13.5px;margin-bottom:20px;}
  .emg-selected-tag button{margin-left:auto;background:none;border:none;color:#c81e34;font-weight:700;font-size:12.5px;}
  .emg-big-input{width:100%;padding:18px 16px;font-size:17px;border-radius:14px;border:2px solid var(--border-strong);margin-bottom:14px;font-weight:600;}
  .emg-big-input:focus{border-color:#c81e34;outline:none;}
  .emg-submit{
    width:100%;padding:20px;background:#c81e34;color:#fff;border:none;border-radius:14px;
    font-family:var(--font-display);font-weight:700;font-size:17px;box-shadow:0 6px 16px rgba(200,30,52,.35);
  }
  .emg-submit:disabled{opacity:.45;}
  .emg-cancel{display:block;margin:16px auto 0;background:none;border:none;color:var(--text-muted);font-weight:600;font-size:13px;}
  .emg-confirm-icon{width:70px;height:70px;border-radius:50%;background:#fce7e9;color:#c81e34;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;}
  .emg-banner{
    display:flex;align-items:center;gap:12px;background:#fdf1f2;border:1.5px solid #f6c3ca;color:#a3132a;
    border-radius:12px;padding:13px 15px;margin-bottom:18px;font-size:13px;font-weight:600;
  }
  .emg-banner button{margin-left:auto;background:#c81e34;color:#fff;border:none;padding:9px 14px;border-radius:9px;font-weight:700;font-size:12.5px;font-family:var(--font-display);flex:none;}

  @media (min-width:900px){
    :root{--sidebar-w:272px;}
    .hamburger{display:none;}
    .sidebar{transform:translateX(0);position:fixed;}
    .backdrop{display:none;}
    .topbar{padding-left:calc(var(--sidebar-w) + 18px);}
    .shell{padding-left:var(--sidebar-w);}
    .main{padding:28px 34px 60px;max-width:1080px;}
    .kpi-grid{grid-template-columns:repeat(4,minmax(0,1fr));}
    .form-grid-2{grid-template-columns:1fr 1fr;}
    .sensor-grid{grid-template-columns:repeat(2,1fr);}
  }
  @media (prefers-reduced-motion: reduce){
    .sidebar{transition:none;}
  }

  /* ---------- Exportação em PDF (via impressão do navegador) ---------- */
  .print-header{display:none;}
  @media print{
    .sidebar, .topbar, .backdrop, .fab-emergency, #toast-root, .profile-switcher,
    .no-print, .form-actions, .dupcheck-box, .search-box, .chip-row, .tab-row,
    .filters-row, .alert-actions{ display:none !important; }
    .shell{padding-left:0 !important;padding-top:0 !important;}
    .main{padding:12px !important;max-width:100% !important;}
    body{background:#fff;}
    .card{box-shadow:none !important;border:1px solid #ccc !important;break-inside:avoid;}
    .print-header{
      display:block !important;font-family:var(--font-body);font-size:11px;color:#555;
      border-bottom:2px solid var(--maroon);padding-bottom:10px;margin-bottom:16px;
    }
    .print-header b{font-family:var(--font-display);font-size:15px;color:var(--maroon);}
    .print-header span{display:block;margin-top:4px;line-height:1.5;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   PRECOR — dados de demonstração e estado da aplicação
   Referência: Unidade de Sarapuí — Universal Chemical
   ========================================================= */

const ICONS = {
  shield:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 3L19 6V11C19 15.5 16 19 12 21C8 19 5 15.5 5 11V6L12 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>',

function maybeShowOnboarding(role){
  if(state.onboardingSeenRoles.includes(role)) return;
  state.onboardingSeenRoles.push(role);
  state.onboardingOpen = true;
  state.onboardingStep = 0;
}
function onboardingNext(){
  const total = ONBOARDING_CONTENT[state.user.role].length;
  if(state.onboardingStep < total-1){ state.onboardingStep += 1; render(); }
  else { state.onboardingOpen = false; render(); }
}
function closeOnboarding(){ state.onboardingOpen = false; render(); }
function renderOnboarding(){
  const steps = ONBOARDING_CONTENT[state.user.role] || [];
  if(steps.length===0){ state.onboardingOpen=false; return ''; }
  const i = Math.min(state.onboardingStep, steps.length-1);
  const step = steps[i];
  const isLast = i===steps.length-1;
  return `
    <div class="backdrop show" style="z-index:160;"></div>
    <div class="onboarding-card">
      <div class="onboarding-dots">${steps.map((_,idx)=>`<span class="onboarding-dot ${idx===i?'active':''}"></span>`).join('')}</div>
      <span class="badge badge-outline" style="margin-bottom:10px;">${ROLE_LABELS[state.user.role]} · ${i+1}/${steps.length}</span>
      <h3 style="font-size:17px;margin-bottom:8px;">${step.title}</h3>
      <p class="dim" style="font-size:13.5px;line-height:1.55;margin:0 0 20px;">${step.text}</p>
      <div class="form-actions">
        <button class="btn" onclick="closeOnboarding()">Pular</button>
        <button class="btn btn-maroon" onclick="onboardingNext()">${isLast ? 'Entendi' : 'Próximo'}</button>
      </div>
    </div>`;
}

/* ---------- Notificações ativas (toast) ---------- */
/* Independentes do ciclo de render() — anexadas direto ao <body> para
   sobreviverem a re-renderizações e simular um alerta "empurrado" ao
   usuário no instante em que a condição crítica é criada, não só quando
   ele abre a Central de Alertas manualmente. */
/* ---------- Alerta sonoro (Web Audio, sem arquivo externo) ----------
   Chão de fábrica é barulhento e nem sempre alguém está olhando a tela — um bipe curto
   junto do toast crítico cobre esse ponto cego. O AudioContext só é criado a partir de um
   gesto do usuário (ex.: o clique em "Entrar"), respeitando a política de autoplay dos
   navegadores; se não houver contexto disponível, o alerta visual continua funcionando normalmente. */
let audioCtx = null;
function ensureAudioCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ audioCtx = null; }
  }
  return audioCtx;
}
function playCriticalBeep(){
  if(!state.soundEnabled) return;
  const ctx = ensureAudioCtx();
  if(!ctx) return;
  if(ctx.state==='suspended'){ ctx.resume().catch(()=>{}); }
  try{
    const now = ctx.currentTime;
    for(let i=0;i<2;i++){
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.value = 880;
      const t0 = now + i*0.28;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.linearRampToValueAtTime(0.16, t0+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0+0.22);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0+0.25);
    }
  }catch(e){}
}
function toggleSound(){ state.soundEnabled = !state.soundEnabled; render(); }

function showToast(message, level){
  if(level==='critico') playCriticalBeep();
  let root = document.getElementById('toast-root');
  if(!root){
    root = document.createElement('div');
    root.id = 'toast-root';
    root.setAttribute('aria-live','assertive');
    root.setAttribute('aria-atomic','true');
    document.body.appendChild(root);
  }
  const el = document.createElement('div');
  el.className = 'toast toast-'+level;
  const icon = level==='critico' ? ICONS.bellLg : (level==='sucesso' ? ICONS.check : ICONS.info);
  el.innerHTML = icon+'<div class="toast-text"></div>';
  el.querySelector('.toast-text').textContent = message;
  root.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{
    el.classList.remove('show');
    setTimeout(()=>el.remove(), 250);
  }, 6000);
}

function sensorStatus(sensor){
  const v = sensor.value, L = sensor.limits;
  if(sensor.direction==='alta'){
    if(v>=L.critico) return 'CRÍTICO';
    if(v>=L.anormal) return 'ANORMAL';
    if(v>=L.atencao) return 'ATENÇÃO';
    return 'NORMAL';
  } else {
    if(v<=L.critico) return 'CRÍTICO';
    if(v<=L.anormal) return 'ANORMAL';
    if(v<=L.atencao) return 'ATENÇÃO';
    return 'NORMAL';
  }
}

function isRelevantToBrigadista(o){
  return state.alerts.some(a=>o.alertsSent.includes(a.id) && a.targetRoles.includes('brigadista'));
}
/* Se a ocorrência está dentro da área/escopo de atuação do usuário — usado pra decidir se
   o alerta oferece "Confirmar e atender" (ação real) ou só "Confirmar recebimento" (ciência). */
function occurrenceInScope(o, user){
  if(user.role==='seguranca' || user.role==='admin') return true;
  if(user.role==='lideranca') return o.area===user.area;
  if(user.role==='setor') return o.responsible===user.area;
  if(user.role==='brigadista') return isRelevantToBrigadista(o);
  return false;
}
/* Regra de fechamento: qualquer perfil pode avançar até "Resolvida" dentro do seu escopo
   (Brigadista inclusive, para ocorrências em que foi acionado). A transição final para
   "Encerrada" é um duplo-check exclusivo da Segurança do Trabalho / Administrador — ver
   confirmarEncerramento() e reabrirOcorrencia(). */
function canAdvanceOccurrence(o, user){
  if(o.status==='Encerrada') return false;
  const idx = TIMELINE_STEPS.indexOf(o.status);
  const nextStep = TIMELINE_STEPS[idx+1];
  if(nextStep==='Encerrada') return false; // tratado pelo duplo-check dedicado
  if(user.role==='seguranca' || user.role==='admin') return true;
  if(user.role==='lideranca') return o.area===user.area;
  if(user.role==='setor') return o.responsible===user.area;
  if(user.role==='brigadista') return (o.status==='Encaminhada' || o.status==='Em atendimento') && isRelevantToBrigadista(o);
  return false;
}
function canCloseOccurrence(o, user){
  return o.status==='Resolvida' && (user.role==='seguranca' || user.role==='admin');
}
function scopeDescription(user){
  if(user.role==='lideranca') return 'Sua área: '+user.area+' — ocorrências e sensores';
  if(user.role==='setor') return 'Ocorrências e sensores direcionados a: '+user.area;
  return 'Visão geral da unidade — Sarapuí';
}

function formatDatetime(dt){
  const d = new Date(dt);
  if(isNaN(d)) return dt;
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const hh = String(d.getHours()).padStart(2,'0');
  const mi = String(d.getMinutes()).padStart(2,'0');
  return dd+'/'+mm+' '+hh+':'+mi;
}

function selectLoginUser(id){ state.selectedLoginUser = DEMO_USERS.find(u=>u.id===id); state.loginError=''; render(); }

function doLogin(){
  ensureAudioCtx();
  if(!state.selectedLoginUser){
    state.loginError = 'Selecione um usuário de demonstração para continuar.';
    state.showDemoUsers = true;
    render();
    return;
  }
  state.user = state.selectedLoginUser;
  state.loginError='';
  state.loginLog.unshift({
    id:'LGN-'+String(state.loginLog.length+1).padStart(4,'0'),
    timestamp: formatDatetime(new Date().toISOString()),
    user: state.user.name, role: ROLE_LABELS[state.user.role], email: state.user.email
  });
  maybeShowOnboarding(state.user.role);
  navigate('dashboard');
  startMonitorJitter();
}
function doLogout(){
  stopMonitorJitter();
  state.user=null; state.selectedLoginUser=null; state.screen='login'; state.showDemoUsers=false;
  render();
}

/* Troca de perfil sem logout — recurso de demonstração/apresentação: permite alternar
   entre os 5 perfis mantendo os dados já criados na sessão (ocorrências, alertas, leituras),
   para mostrar a continuidade do fluxo entre papéis sem precisar sair e entrar de novo. */
function toggleProfileSwitcher(v){ state.profileSwitcherOpen = v; render(); }
function switchProfile(userId){
  const target = DEMO_USERS.find(u=>u.id===userId);
  if(!target) return;
  const previous = state.user.name;
  state.user = target;
  state.profileSwitcherOpen = false;
  state.sidebarOpen = false;
  logAudit('Perfil alternado (demonstração)', previous+' → '+target.name+' ('+ROLE_LABELS[target.role]+')');
  showToast('Agora você está vendo o PRECOR como '+target.name+' ('+ROLE_LABELS[target.role]+').', 'info');
  maybeShowOnboarding(target.role);
  navigate('dashboard');
}
function renderProfileSwitcher(){
  return `
    <div class="backdrop show" onclick="toggleProfileSwitcher(false)" style="z-index:150;"></div>
    <div class="profile-switcher">
      <div class="profile-switcher-head">
        <div><b>Trocar perfil</b><span class="dim" style="font-size:11.5px;display:block;margin-top:2px;">Recurso de demonstração — os dados da sessão são mantidos.</span></div>
        <button class="sidebar-close" style="color:var(--text-dim);" onclick="toggleProfileSwitcher(false)" aria-label="Fechar">${ICONS.close}</button>
      </div>
      <div class="demo-list" style="padding:14px 18px 18px;">
        ${DEMO_USERS.map(u=>`
          <button class="demo-card ${state.user.id===u.id?'active':''}" onclick="switchProfile('${u.id}')" type="button">
            <div class="demo-avatar">${u.initials}</div>
            <div><b>${u.name}</b><span>${ROLE_LABELS[u.role]}</span></div>
          </button>`).join('')}
      </div>
    </div>`;
}

/* ---------- Busca global ---------- */
function toggleGlobalSearch(v){
  state.globalSearchOpen = v;
  if(!v) state.globalSearchQuery = '';
  render();
  if(v) setTimeout(()=>{ const i=document.getElementById('global-search-input'); if(i) i.focus(); }, 30);
}
function globalSearchResults(){
  const q = state.globalSearchQuery.trim().toLowerCase();
  if(!q) return {occ:[], proc:[], alert:[]};
  const occ = occurrencesForUser(state.user).filter(o=>(o.id+' '+o.type+' '+o.location+' '+o.area+' '+o.description).toLowerCase().includes(q)).slice(0,6);
  const proc = state.procedures.filter(p=>(p.title+' '+p.description+' '+p.category).toLowerCase().includes(q)).slice(0,6);
  const alert = state.alerts.filter(a=>a.targetRoles.includes(state.user.role) && (a.title+' '+a.message+' '+a.category).toLowerCase().includes(q)).slice(0,6);
  return {occ, proc, alert};
}
function goToSearchResult(type, id){
  toggleGlobalSearch(false);
  if(type==='occ') abrirOcorrencia(id);
  else if(type==='proc') abrirProcedimento(id);
  else if(type==='alert') navigate('alertas');
}
function renderGlobalSearch(){
  const r = globalSearchResults();
  const hasQuery = state.globalSearchQuery.trim().length>0;
  const totalResults = r.occ.length + r.proc.length + r.alert.length;
  return `
    <div class="backdrop show" onclick="toggleGlobalSearch(false)" style="z-index:150;"></div>
    <div class="global-search-panel">
      <div class="global-search-input-row">
        ${ICONS.search}
        <input id="global-search-input" type="text" placeholder="Buscar ocorrências, procedimentos, alertas..." value="${state.globalSearchQuery}" oninput="state.globalSearchQuery=this.value; render(); const i=document.getElementById('global-search-input'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length); }">
        <button class="sidebar-close" style="color:var(--text-dim);" onclick="toggleGlobalSearch(false)" aria-label="Fechar busca">${ICONS.close}</button>
      </div>
      <div class="global-search-results">
        ${!hasQuery ? '<div class="dim" style="padding:20px;text-align:center;font-size:12.5px;">Digite para buscar em tudo que está no seu escopo.</div>' : ''}
        ${hasQuery && totalResults===0 ? '<div class="dim" style="padding:20px;text-align:center;font-size:12.5px;">Nenhum resultado encontrado.</div>' : ''}
        ${r.occ.length ? `<div class="search-group-label">Ocorrências</div>` + r.occ.map(o=>`
          <button class="search-result-item" onclick="goToSearchResult('occ','${o.id}')">
            ${ICONS.doc}<div><b>${o.type} — ${o.location}</b><span>${o.id} · ${o.area}</span></div>${critBadge(o.criticality)}
          </button>`).join('') : ''}
        ${r.proc.length ? `<div class="search-group-label">Procedimentos</div>` + r.proc.map(p=>`
          <button class="search-result-item" onclick="goToSearchResult('proc','${p.id}')">
            ${ICONS.book}<div><b>${p.title}</b><span>${p.category}</span></div>
          </button>`).join('') : ''}
        ${r.alert.length ? `<div class="search-group-label">Alertas</div>` + r.alert.map(a=>`
          <button class="search-result-item" onclick="goToSearchResult('alert','${a.id}')">
            ${ICONS.bell}<div><b>${a.title}</b><span>${a.area}</span></div>${critBadge(a.level)}
          </button>`).join('') : ''}
      </div>
    </div>`;
}

  switch(state.screen){

        <div class="card kpi teal"><div class="l">Procedimentos disponíveis</div><div class="n">${state.procedures.length}</div><div class="s">na biblioteca</div></div>

        <div class="card alert-card ${a.level}" onclick="navigate('alertas')" style="cursor:pointer;">

          <b class="a-title">${a.title}</b>

    <div class="section-title"><h3>Ocorrências recentes</h3>
      <button class="btn-link" onclick="navigate('${u.role==='seguranca'||u.role==='admin' ? 'gestao':'ocorrencias'}')">Ver todas</button>
    </div>
    ${recentes.length===0 ? '<div class="card empty-state">Nenhuma ocorrência no seu escopo no momento.</div>' : recentes.map(o=>`
      <div class="card occ-card" onclick="abrirOcorrencia('${o.id}')">

function setDraftField(key, val){
  captureDraft();
  state.formDraft[key] = val;
  if(key==='criticality'){
    state.formDraft.brigada = (val==='alto' || val==='critico');
  }
  render();
}
function toggleBrigada(){
  captureDraft();
  state.formDraft.brigada = !state.formDraft.brigada;
  render();
}
function captureDraft(){
  if(state.formDraft) return;
  state.formDraft = {type:'Vazamento', description:'', location:'', area:'Produção — Reatores', criticality:'medio', responsible:'Segurança do Trabalho', observations:'', brigada:false};
}

function submitOccurrence(){
  captureDraft();
  const type = state.formDraft.type;
  const description = document.getElementById('f-desc').value.trim();
  const location = document.getElementById('f-loc').value.trim();
  const area = document.getElementById('f-area').value;
  const criticality = state.formDraft.criticality;
  const responsible = document.getElementById('f-resp').value;
  const observations = document.getElementById('f-obs').value.trim();
  const brigada = !!state.formDraft.brigada;

  if(!description || !location){
    state.registrarError = 'Preencha ao menos a descrição e a localização da ocorrência.';
    render();
    return;
  }
  state.registrarError = '';

  occurrenceSeq += 1;
  const protocol = 'OC-2026-' + occurrenceSeq;
  const now = new Date();
  const nowLabel = formatDatetime(now.toISOString());

  const encaminhadaNote = 'Encaminhada automaticamente para '+responsible+'.' + (brigada ? ' Brigada de Emergência acionada para resposta imediata em campo.' : '');
  const newOcc = {
    id: protocol, type, description, location, area, criticality,
    datetime: now.toISOString(), responsible, status: 'Encaminhada', observations,
    history:[
      {step:'Registrada', by:state.user.name, at:nowLabel, note:'Ocorrência registrada pelo usuário.'},
      {step:'Encaminhada', by:'Sistema PRECOR', at:nowLabel, note:encaminhadaNote},
    ], alertsSent:[]
  };

  const alertId = 'AL-' + (3300 + state.alerts.length + 4);
  const targetRolesByCrit = {baixo:['setor'], medio:['seguranca','setor'], alto:['seguranca'], critico:['seguranca','admin']};
  const targetRoles = [...targetRolesByCrit[criticality]];
  if(brigada && !targetRoles.includes('brigadista')) targetRoles.push('brigadista');
  const newAlert = {
    id:alertId, occurrenceId:protocol, level:criticality, category:'Ocorrência',
    title:type+' — '+location, message:description || 'Nova ocorrência registrada no PRECOR.',
    area, targetRoles, timestamp: nowLabel, confirmations:[], read:false
  };

  newOcc.alertsSent.push(alertId);
  state.occurrences.unshift(newOcc);
  state.alerts.unshift(newAlert);
  state.lastConfirmedProtocol = protocol;
  state.formDraft = null;
  logAudit('Ocorrência registrada', protocol+' — '+type+' ('+fmtCrit(criticality)+', '+location+')');
  if(criticality==='critico'){
    showToast('Ocorrência crítica registrada: '+type+' — '+location, 'critico');
  } else if(brigada){
    showToast('Brigada de Emergência acionada: '+type+' — '+location, 'critico');
  }
  render();
}

/* ============================= EMERGÊNCIA (fluxo rápido) ============================= */

function abrirEmergencia(){
  state.emergencyStep = 1;
  state.emergencyDraft = {type:'', location:'', detail:''};
  state.lastEmergencyProtocol = null;
  navigate('emergencia');
}
function cancelEmergency(){ navigate('dashboard'); }

function selectEmergencyType(type){
  state.emergencyDraft.type = type;
  state.emergencyStep = 2;
  render();
  setTimeout(()=>{ const i=document.getElementById('emg-loc'); if(i) i.focus(); }, 30);
}

function voltarEmergencyTipo(){ state.emergencyStep = 1; render(); }

function submitEmergency(){
  const location = document.getElementById('emg-loc').value.trim();
  const detail = document.getElementById('emg-detail') ? document.getElementById('emg-detail').value.trim() : '';
  if(!location){
    state.emergencyError = 'Informe rapidamente o local da emergência.';
    render();
    setTimeout(()=>{ const i=document.getElementById('emg-loc'); if(i) i.focus(); }, 30);
    return;
  }
  state.emergencyError = '';

  occurrenceSeq += 1;
  const protocol = 'OC-2026-' + occurrenceSeq;
  const now = new Date();
  const nowLabel = formatDatetime(now.toISOString());
  const type = state.emergencyDraft.type;

  const newOcc = {
    id: protocol, type, description: detail || ('Emergência registrada via fluxo rápido: '+type+'.'),
    location, area: location, criticality:'critico',
    datetime: now.toISOString(), responsible:'Brigada de Emergência', status:'Encaminhada',
    observations:'Registrada pelo fluxo rápido de emergência.',
    history:[
      {step:'Registrada', by:state.user.name, at:nowLabel, note:'Registrada via fluxo rápido de emergência (registro simplificado).'},
      {step:'Encaminhada', by:'Sistema PRECOR', at:nowLabel, note:'Encaminhamento automático crítico para Brigada, Segurança do Trabalho e Administração.'},
    ], alertsSent:[]
  };

  const alertId = 'AL-' + (3300 + state.alerts.length + 4);
  const newAlert = {
    id:alertId, occurrenceId:protocol, level:'critico', category:'Emergência',
    title:type+' — '+location, message: detail || ('Emergência reportada em '+location+'. Ação imediata necessária.'),
    area: location, targetRoles:['brigadista','seguranca','admin'], timestamp: nowLabel, confirmations:[], read:false
  };

  newOcc.alertsSent.push(alertId);
  state.occurrences.unshift(newOcc);
  state.alerts.unshift(newAlert);
  state.lastEmergencyProtocol = protocol;
  logAudit('Emergência registrada (fluxo rápido)', protocol+' — '+type+' ('+location+')');
  showToast('Emergência registrada: '+type+' — '+location, 'critico');
  render();
}

/* ============================= LISTAS DE OCORRÊNCIAS ============================= */

function renderOcorrencias(){
  const statusTabs = ['Todas','Abertas','Em Andamento','Concluídas'];
  const critTabs = ['Todos','critico','alto','medio','baixo'];
  let list = occurrencesForUser(state.user);
  if(state.occStatusTab==='Abertas') list = list.filter(o=>o.status==='Registrada'||o.status==='Encaminhada');
  else if(state.occStatusTab==='Em Andamento') list = list.filter(o=>o.status==='Em atendimento'||o.status==='Resolvida');
  else if(state.occStatusTab==='Concluídas') list = list.filter(o=>o.status==='Encerrada');
  if(state.occCritTab!=='Todos') list = list.filter(o=>o.criticality===state.occCritTab);
  if(state.occSearch.trim()) list = list.filter(o=>(o.type+' '+o.location+' '+o.area).toLowerCase().includes(state.occSearch.toLowerCase()));

  return `
    <div class="dim" style="font-size:12.5px;font-weight:600;margin-bottom:14px;">${scopeDescription(state.user)}</div>
    <div class="search-box">${ICONS.search}<input type="text" placeholder="Buscar por título ou área..." value="${state.occSearch}" oninput="state.occSearch=this.value; render();"></div>
    <div class="chip-row">${statusTabs.map(s=>`<button class="chip ${state.occStatusTab===s?'active':''}" onclick="state.occStatusTab='${s}'; render();">${s}</button>`).join('')}</div>
    <div class="chip-row">${critTabs.map(c=>`<button class="chip ${state.occCritTab===c?'active':''}" onclick="state.occCritTab='${c}'; render();">${c==='Todos'?'Todos':fmtCrit(c)}</button>`).join('')}</div>
    <div class="results-count">${list.length} ocorrência${list.length===1?'':'s'} encontrada${list.length===1?'':'s'}</div>
    ${list.length===0 ? '<div class="card empty-state">Nenhuma ocorrência corresponde ao seu escopo ou aos filtros selecionados.</div>' : list.map(o=>`
      <div class="card occ-card" onclick="abrirOcorrencia('${o.id}')">
        <div class="occ-top"><b>${o.type} — ${o.location}</b>${critBadge(o.criticality)}</div>
        <div class="occ-tags">${o.id} ${statusBadge(o.status)}</div>
        <div class="occ-meta">${o.area} · ${formatDatetime(o.datetime)}</div>
      </div>`).join('')}`;
}

function renderDetalhe(){
  const o = findOccurrence(state.selectedOccurrenceId);

  const relatedAlerts = state.alerts.filter(a=>o.alertsSent.includes(a.id));
  const canAdvance = canAdvanceOccurrence(o, state.user);
  const canClose = canCloseOccurrence(o, state.user);
  const nextStep = TIMELINE_STEPS[stepIndex+1];
  const advanceLabel = nextStep==='Resolvida' ? 'Marcar como resolvida' : 'Avançar para "'+nextStep+'"';

  const backTarget = ROLE_NAV[state.user.role].includes('gestao') ? 'gestao' : (ROLE_NAV[state.user.role].includes('ocorrencias') ? 'ocorrencias' : 'alertas');

  let actionBlock = '';
  const brigadistaResolving = state.user.role==='brigadista' && nextStep==='Resolvida';
  if(state.resolveNoteOpen && state.resolveNoteOccId===o.id){
    actionBlock = `
      <div class="dupcheck-box" style="background:var(--teal-bg);border-color:#bfe3da;">
        <div class="dupcheck-label" style="color:var(--teal);">${ICONS.check} Como a ocorrência foi resolvida?</div>
        <p>Descreva rapidamente as ações tomadas em campo e, se necessário, anexe uma foto como comprovação. A Segurança do Trabalho verá esse relato no duplo-check de encerramento.</p>
        <textarea id="resolve-note" placeholder="Ex.: Vazamento contido, área isolada, produto recolhido, equipe liberada em segurança..."></textarea>
        ${state.resolveError ? '<div class="field-error">'+state.resolveError+'</div>' : ''}
        ${renderAttachWidget('resolveNoteImage','resolveNoteImageName')}
        <div class="form-actions" style="margin-top:12px;">
          <button class="btn" onclick="cancelarResolucao()">Cancelar</button>
          <button class="btn btn-maroon" onclick="confirmarResolucao('${o.id}')">Confirmar resolução</button>
        </div>
      </div>`;
  } else if(canClose){
    actionBlock = `
      <div class="dupcheck-box">
        <div class="dupcheck-label">${ICONS.check} Duplo-check de encerramento — Segurança do Trabalho</div>
        <p>A ocorrência foi marcada como resolvida. Confirme se a resolução foi efetiva antes de encerrar definitivamente.</p>
        <div class="form-actions">
          <button class="btn" onclick="reabrirOcorrencia('${o.id}')">Reabrir — não foi resolvida</button>

        <div class="dupcheck-label" style="color:var(--blue);">${ICONS.check} ${advanceLabel}</div>
        <p>Adicione uma observação e, se necessário, anexe uma imagem como comprovação antes de confirmar.</p>

        </div>
      </div>`;
  } else if(canAdvance && nextStep){
    const onclickAction = brigadistaResolving ? `abrirResolucaoForm('${o.id}')` : `abrirAvancoForm('${o.id}')`;
    actionBlock = `<div class="form-actions" style="margin-top:16px;"><button class="btn btn-maroon" onclick="${onclickAction}">${advanceLabel}</button></div>`;

        <div class="dg-item"><span>Responsável</span><b>${o.responsible}</b></div>

      </div>

      ${actionBlock}
    </div>

    <div class="card panel-pad" style="margin-bottom:16px;">
      <div class="section-title"><h3>Histórico de atualizações</h3></div>
      ${o.history.map(h=>`<div class="log-item"><div class="log-dot"></div><div><b>${h.step} — ${h.by}</b><span>${h.at} · ${h.note}</span>${h.image ? '<img class="history-image" src="'+h.image+'" alt="Comprovação anexada" onclick="window.open(this.src)">' : ''}</div></div>`).join('')}
    </div>

    <div class="card panel-pad">
      <div class="section-title"><h3>Alertas enviados</h3></div>
      ${relatedAlerts.length ? relatedAlerts.map(a=>`<div class="log-item"><div class="log-dot" style="background:var(--red);"></div><div><b>${a.title}</b><span>${a.timestamp} · Confirmado por: ${a.confirmations.length ? a.confirmations.join(', ') : 'ninguém ainda'}</span></div></div>`).join('') : '<div class="dim">Nenhum alerta associado.</div>'}

  showToast('Ocorrência marcada como resolvida. Aguardando duplo-check.', 'sucesso');

  state.advanceFormOccId = id;

  state.advanceFormImageName = '';

  state.advanceFormImage = null;

  render();
}
function confirmarAvanco(id){
  const o = findOccurrence(id);
  const idx = TIMELINE_STEPS.indexOf(o.status);
  const next = TIMELINE_STEPS[idx+1];
  if(!next || next==='Encerrada') return; // encerramento passa pelo duplo-check dedicado
  const noteInput = document.getElementById('advance-note');
  const customNote = noteInput ? noteInput.value.trim() : '';
  o.status = next;
  const entry = {step:next, by:state.user.name, at:formatDatetime(new Date().toISOString()), note: customNote || ('Status atualizado manualmente por '+ROLE_LABELS[state.user.role]+'.')};
  if(state.advanceFormImage) entry.image = state.advanceFormImage;
  o.history.push(entry);
  state.advanceFormOpen = false;
  state.advanceFormOccId = null;
  state.advanceFormImage = null;
  state.advanceFormImageName = '';
  showToast('Ocorrência '+o.id+' avançada para "'+next+'".', 'sucesso');
  logAudit('Status de ocorrência atualizado', o.id+' → "'+next+'"');
  render();
}

function handleImageFile(inputEl, imageKey, nameKey){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ showToast('Selecione um arquivo de imagem.', 'alerta'); return; }
  const maxBytes = 5*1024*1024;
  if(file.size > maxBytes){ showToast('Imagem muito grande (máx. 5MB). Escolha um arquivo menor.', 'alerta'); return; }
  state[imageKey+'Loading'] = true;
  render();
  const reader = new FileReader();
  reader.onload = function(e){
    state[imageKey] = e.target.result;
    state[nameKey] = file.name;
    state[imageKey+'Loading'] = false;
    render();
  };
  reader.onerror = function(){
    state[imageKey+'Loading'] = false;
    showToast('Não foi possível ler a imagem. Tente novamente.', 'alerta');
    render();
  };
  reader.readAsDataURL(file);
}
function removeAttachedImage(imageKey, nameKey){
  state[imageKey] = null;
  state[nameKey] = '';
  render();
}
function renderAttachWidget(imageKey, nameKey){
  const img = state[imageKey];
  if(state[imageKey+'Loading']){
    return `<div class="attach-row"><div class="attach-loading">${ICONS.info} Carregando imagem…</div></div>`;
  }
  if(img){
    return `<div class="attach-row"><div class="attach-preview"><img src="${img}" alt="Comprovação anexada"><button class="attach-remove" onclick="removeAttachedImage('${imageKey}','${nameKey}')" title="Remover imagem" aria-label="Remover imagem">${ICONS.trash}</button></div><div class="dim" style="font-size:11px;margin-top:4px;">${state[nameKey]}</div></div>`;
  }
  return `<div class="attach-row"><label class="attach-btn">${ICONS.camera} Anexar imagem (opcional, máx. 5MB)<input type="file" accept="image/*" onchange="handleImageFile(this,'${imageKey}','${nameKey}')"></label></div>`;
}

function renderAlertas(){
  const u = state.user;
  const naoLidos = state.alerts.filter(a=>!a.read);
  const criticos = state.alerts.filter(a=>a.level==='critico');
  let list;
  if(state.alertTab==='nao-lidos') list = naoLidos;
  else if(state.alertTab==='criticos') list = criticos;
  else list = state.alerts;

  return `
    <div class="tab-row">
      <button class="chip ${state.alertTab==='todos'?'active':''}" onclick="setAlertTab('todos')">Todos (${state.alerts.length})</button>
      <button class="chip ${state.alertTab==='nao-lidos'?'active':''}" onclick="setAlertTab('nao-lidos')">Não lidos (${naoLidos.length})</button>
      <button class="chip ${state.alertTab==='criticos'?'active':''}" onclick="setAlertTab('criticos')">Críticos</button>
      <button class="btn-link" style="margin-left:auto;" onclick="marcarTodasLidas()">Marcar todas como lidas</button>
    </div>
    ${list.length===0 ? '<div class="card empty-state">Nenhum alerta nesta categoria.</div>' : list.map(a=>{
      const linkedOcc = a.occurrenceId!=='—' ? findOccurrence(a.occurrenceId) : null;
      const confirmed = a.confirmations.includes(u.name);
      const canAttend = linkedOcc && occurrenceInScope(linkedOcc, u);
      return `
      <div class="card alert-card ${a.level}">
        <div class="alert-tags">
          <span class="badge badge-outline">${a.category}</span>
          ${critBadge(a.level)}
          ${!a.read ? '<span class="badge badge-novo">Novo</span>' : ''}
          ${linkedOcc ? statusBadge(linkedOcc.status) : ''}
        </div>
        <b class="a-title">${a.title}</b>
        <p>${a.message}</p>
        <div class="alert-meta-row"><span>${a.timestamp}</span><span>${a.area}</span></div>
        <div class="alert-actions">
          ${!a.read ? '<button class="btn btn-sm" onclick="marcarLida(\''+a.id+'\')">Marcar lida</button>' : ''}
          ${confirmed
            ? '<span class="badge badge-encerrada">'+ICONS.check+' Confirmado</span>' + (linkedOcc ? '<button class="btn btn-sm" onclick="abrirOcorrencia(\''+a.occurrenceId+'\')">Ver ocorrência</button>' : '')
            : (canAttend
                ? '<button class="btn btn-maroon btn-sm" onclick="confirmarEAtender(\''+a.id+'\',\''+a.occurrenceId+'\')">Confirmar e atender ocorrência</button>'
                : '<button class="btn btn-maroon btn-sm" onclick="confirmarAlerta(\''+a.id+'\')">Confirmar recebimento</button>' + (linkedOcc ? '<button class="btn btn-sm" onclick="abrirOcorrencia(\''+a.occurrenceId+'\')">Ver ocorrência</button>' : ''))}
        </div>
        ${!linkedOcc ? '<div class="dim" style="font-size:11.5px;margin-top:10px;">Alerta informativo — nenhuma ação adicional necessária.</div>' : ''}
        ${linkedOcc && !canAttend && !confirmed ? '<div class="dim" style="font-size:11.5px;margin-top:10px;">Fora da sua área de atuação — apenas ciência.</div>' : ''}
      </div>`;
    }).join('')}`;
}

function setAlertTab(tab){ state.alertTab = tab; render(); }
function marcarLida(id){ const a = state.alerts.find(x=>x.id===id); if(a) a.read=true; render(); }
function marcarTodasLidas(){ state.alerts.forEach(a=>a.read=true); render(); }
function confirmarAlerta(id){
  const a = state.alerts.find(x=>x.id===id);
  if(a){ if(!a.confirmations.includes(state.user.name)) a.confirmations.push(state.user.name); a.read=true; logAudit('Alerta confirmado', a.id+' — '+a.title); }
  render();
}
function confirmarEAtender(alertId, occurrenceId){
  const a = state.alerts.find(x=>x.id===alertId);
  if(a){ if(!a.confirmations.includes(state.user.name)) a.confirmations.push(state.user.name); a.read=true; logAudit('Alerta confirmado e ocorrência atendida', a.id+' — '+a.title); }
  abrirOcorrencia(occurrenceId);
}

function submitReading(){
  const sensorId = state.readingDraft.sensorId;
  const valueRaw = document.getElementById('rd-value').value.replace(',', '.').trim();
  const value = parseFloat(valueRaw);
  const responsible = document.getElementById('rd-resp').value.trim() || state.user.name;
  const observations = document.getElementById('rd-obs').value.trim();
  if(isNaN(value)){
    state.readingError = 'Informe um valor numérico para a leitura.';
    render();
    return;
  }

  const sensor = findSensorById(sensorId);
  const newReading = {
    id: 'LT-' + String(state.readings.length + 1).padStart(3,'0'),
    sensorId, datetime: new Date().toISOString(), value, responsible, observations
  };
  state.readings.unshift(newReading);

  const st = statusForValue(sensor, value);
  if(st==='CRÍTICO'){
    state.alerts.unshift({
      id:'AL-LT-'+Date.now().toString().slice(-4), occurrenceId:'—', level:'critico', category:'Monitoramento',
      title:'Leitura crítica registrada — '+sensor.name,

  state.readingDraft = null;

function simularAnormalidade(){
  stopMonitorJitter();
  const pool = sensorsForUser(state.user);
  const target = pool[Math.floor(Math.random()*pool.length)];
  target.value = target.direction==='alta' ? target.limits.critico + target.limits.critico*0.05 : Math.max(0, target.limits.critico - target.limits.critico*0.4);
  target._hist = (target._hist || []).concat(target.value).slice(-6);
  state.monitorAnomalyActive = true;
  state.alerts.unshift({
    id:'AL-SIM-'+Date.now().toString().slice(-4), occurrenceId:'—', level:'critico', category:'Monitoramento',
    title:'Condição anormal identificada — '+target.name,
    message:'Leitura de '+target.value.toFixed(1)+' '+target.unit+' ultrapassou o limite crítico configurado para este ponto de monitoramento.',
    area: target.area, targetRoles:['seguranca','brigadista','admin'], timestamp: formatDatetime(new Date().toISOString()), confirmations:[], read:false
  });
  showToast('Condição anormal identificada — '+target.name, 'critico');
  logAudit('Anomalia simulada', target.name+' — leitura forçada para '+target.value.toFixed(1)+' '+target.unit);
  render();
}
function restaurarSensores(){
  state.sensors.forEach(s=>{ s.value = s.base; s._hist = []; s._predictiveAlerted = false; });
  state.monitorAnomalyActive = false;
  startMonitorJitter();
  render();
}
function startMonitorJitter(){
  stopMonitorJitter();
  state.monitorSimTimer = setInterval(()=>{
    if(state.monitorAnomalyActive) return;
    state.sensors.forEach(s=>{
      const delta = (Math.random()-0.5) * 2 * s.jitter;
      let v = s.value + delta;
      const floor = s.direction==='alta' ? s.base * 0.7 : s.limits.critico * 0.6;
      const ceil = s.direction==='alta' ? s.limits.atencao * 0.96 : s.base * 1.15;
      v = Math.min(ceil, Math.max(floor, v));
      s.value = Math.round(v*10)/10;
      s._hist = (s._hist || []).concat(s.value).slice(-6);
    });
    checkPredictiveAlerts();
    if(state.screen==='monitoramento' || state.screen==='dashboard') render();
  }, 3500);
}
function stopMonitorJitter(){ if(state.monitorSimTimer){ clearInterval(state.monitorSimTimer); state.monitorSimTimer=null; } }

/* Fecha o ciclo "prevenção → ação": quando a tendência aponta que um sensor vai cruzar o
   próximo limite em breve, gera um alerta preditivo para a Segurança do Trabalho ANTES do
   limite ser de fato cruzado — sem isso, a predição seria só um número bonito na tela sem
   nenhuma consequência real. Dispara uma única vez por episódio (reseta quando a condição
   volta a estabilizar ou é restaurada). */
function checkPredictiveAlerts(){
  state.sensors.forEach(s=>{
    const t = sensorTrend(s);
    if(t.trend==='piorando' && t.etaMin && t.etaMin<=2){
      if(!s._predictiveAlerted){
        s._predictiveAlerted = true;
        state.alerts.unshift({
          id:'AL-PRED-'+Date.now().toString().slice(-4)+'-'+s.id, occurrenceId:'—',
          level: t.nextLabel==='CRÍTICO' ? 'alto' : 'medio', category:'Monitoramento (Preditivo)',
          title:'Previsão: '+s.name+' pode atingir '+t.nextLabel,
          message:'A tendência das últimas leituras indica que este ponto pode cruzar o limite de '+t.nextLabel+' em aproximadamente '+t.etaMin+' minuto(s), caso a condição atual persista.',
          area: s.area, targetRoles:['seguranca','admin'], timestamp: formatDatetime(new Date().toISOString()), confirmations:[], read:false
        });
        showToast('Previsão: '+s.name+' pode atingir '+t.nextLabel+' em ~'+t.etaMin+' min', 'alerta');
        logAudit('Alerta preditivo gerado', s.name+' — previsão de '+t.nextLabel+' em ~'+t.etaMin+' min');
      }
    } else if(t.trend==='estavel' || t.trend==='melhorando' || t.trend==='critico'){
      s._predictiveAlerted = false;
    }
  });
}

/* ---------- Tendência preditiva (regressão simples sobre o histórico recente) ----------
   Estima, a partir da inclinação das últimas leituras, se a condição está piorando e em
   quanto tempo tende a cruzar o próximo limite — transforma o monitoramento de reativo
   (só avisa quando já cruzou o limite) em preventivo (avisa que está indo na direção errada). */
function sensorTrend(sensor){
  const hist = sensor._hist || [];
  if(hist.length < 3) return {trend:'coletando'};
  const first = hist[0], last = hist[hist.length-1];
  const steps = hist.length - 1;
  const slope = (last-first)/steps;
  const st = sensorStatus(sensor);
  if(st==='CRÍTICO') return {trend:'critico'};
  const worsening = sensor.direction==='alta' ? slope > 0.12 : slope < -0.12;
  const improving = sensor.direction==='alta' ? slope < -0.12 : slope > 0.12;
  if(improving) return {trend:'melhorando'};
  if(!worsening) return {trend:'estavel'};
  const L = sensor.limits;
  const target = st==='NORMAL' ? L.atencao : st==='ATENÇÃO' ? L.anormal : L.critico;
  const nextLabel = st==='NORMAL' ? 'ATENÇÃO' : st==='ATENÇÃO' ? 'ANORMAL' : 'CRÍTICO';
  const stepsToTarget = (target - last) / slope;
  if(!isFinite(stepsToTarget) || stepsToTarget <= 0) return {trend:'piorando', etaMin:null, nextLabel};
  const etaMin = Math.max(1, Math.round((stepsToTarget * 3.5) / 60));
  return {trend:'piorando', etaMin, nextLabel};
}
function renderTrendLine(sensor){
  const t = sensorTrend(sensor);
  if(t.trend==='coletando' || t.trend==='critico') return '';
  if(t.trend==='estavel') return '<div class="trend-line trend-stable">'+ICONS.trendFlat+' Estável</div>';
  if(t.trend==='melhorando') return '<div class="trend-line trend-good">'+ICONS.trendDown+' Melhorando</div>';
  const etaText = t.etaMin ? ' — pode atingir '+t.nextLabel+' em ~'+t.etaMin+' min' : '';
  return '<div class="trend-line trend-bad">'+ICONS.trendUp+' Tendência de alta'+etaText+'</div>';
}
function renderSparkline(sensor){
  const hist = sensor._hist || [];
  if(hist.length < 2) return '';
  const w = 70, h = 24, pad = 3;
  const min = Math.min(...hist), max = Math.max(...hist);
  const range = (max-min) || 1;
  const stepX = hist.length>1 ? (w-pad*2)/(hist.length-1) : 0;
  const points = hist.map((v,i)=>{
    const x = pad + i*stepX;
    const y = h-pad - ((v-min)/range)*(h-pad*2);
    return x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
  const st = sensorStatus(sensor);
  const color = st==='CRÍTICO' ? 'var(--red)' : st==='ANORMAL' ? 'var(--orange)' : st==='ATENÇÃO' ? 'var(--amber)' : 'var(--teal)';
  return '<svg class="sparkline" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true"><polyline points="'+points+'" fill="none" stroke="'+color+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
